services:
  postgres:
    image: postgres:16
    container_name: nyc_data_pipeline_postgres
    environment:
      POSTGRES_DB: nyc_data_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
